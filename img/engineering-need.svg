<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Engineering practices by scope and consequences</title>
<desc id="desc">Four contexts, Exploratory, Lab use, Collaborator use, and Assured, arranged along axes for scope and impact and consequences of failure. Each card describes its main concern, why failure matters, and useful engineering practices.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#17294a"/></marker>
 <style><![CDATA[
 text{font-family:Arial,Helvetica,sans-serif;fill:#152238} .axis{stroke:#17294a;stroke-width:4;fill:none;marker-end:url(#arrow)} .card{stroke-width:2.5} .heading{font-size:27px;font-weight:700} .label{font-size:17px;font-weight:700} .body{font-size:17px} .muted{font-size:17px;fill:#58667d} .small{font-size:15px} .axisname{font-size:27px;font-weight:700} .dot{stroke:white;stroke-width:2} ]]></style>
</defs>
<rect width="1536" height="1024" fill="white"/>
<!-- axes -->
<path class="axis" d="M205 790 V46"/><path class="axis" d="M205 790 H1502"/>
<text x="175" y="92" text-anchor="end" font-size="21" font-weight="700">Greater</text><text x="175" y="118" text-anchor="end" font-size="21" font-weight="700">consequences</text>
<text x="175" y="724" text-anchor="end" font-size="21" font-weight="700">Lower</text><text x="175" y="750" text-anchor="end" font-size="21" font-weight="700">consequences</text>
<text class="axisname" x="76" y="480" transform="rotate(-90 76 480)" text-anchor="middle">Consequences of failure</text>
<text class="axisname" x="855" y="943" text-anchor="middle">Scope and impact</text>
<text class="muted" x="855" y="972" text-anchor="middle">How widely the software is used and how long it needs to remain reliable</text>
<!-- gentle progression guide -->
<path d="M230 765 C530 730 835 620 1120 473 S1395 332 1450 310" stroke="#a5b2c2" stroke-width="3" stroke-dasharray="10 9" fill="none"/>
<!-- context areas -->
<rect x="222" y="510" width="292" height="278" fill="#f4eafa" opacity="0.52"/>
<rect x="514" y="385" width="300" height="403" fill="#eaf8ed" opacity="0.52"/>
<rect x="814" y="270" width="330" height="518" fill="#e9f3ff" opacity="0.5"/>
<rect x="1144" y="130" width="345" height="658" fill="#fff4e7" opacity="0.52"/>
<!-- connector lines and dots -->
<path d="M365 648 V744" stroke="#8344d5" stroke-width="3"/><circle class="dot" cx="365" cy="744" r="21" fill="#8344d5"/>
<path d="M660 533 V661" stroke="#15904a" stroke-width="3"/><circle class="dot" cx="660" cy="661" r="21" fill="#15904a"/>
<path d="M978 417 V540" stroke="#2672d8" stroke-width="3"/><circle class="dot" cx="978" cy="540" r="21" fill="#2672d8"/>
<path d="M1317 282 V385" stroke="#ed8119" stroke-width="3"/><circle class="dot" cx="1317" cy="385" r="21" fill="#ed8119"/>
<!-- cards -->
<rect class="card" x="222" y="425" width="292" height="225" rx="16" fill="#f7efff" stroke="#b77be6"/>
<text class="heading" x="243" y="467" fill="#5920a0">Exploratory</text>
<text class="label" x="243" y="502">Main concern</text><text class="body" x="243" y="525">Learn quickly</text>
<text class="label" x="243" y="556">Failure matters because…</text><text class="body" x="243" y="579">We may learn the wrong thing</text>
<text class="label" x="243" y="610">Useful practices</text><text class="body" x="243" y="633">Targeted checks, notes</text>
<rect class="card" x="515" y="300" width="300" height="265" rx="16" fill="#effbf2" stroke="#64c783"/>
<text class="heading" x="537" y="341" fill="#116d38">Lab use</text>
<text class="label" x="537" y="378">Main concern</text><text class="body" x="537" y="402">Support ongoing research</text>
<text class="label" x="537" y="439">Failure matters because…</text><text class="body" x="537" y="463">Research may need</text><text class="body" x="537" y="486">repeating</text>
<text class="label" x="537" y="519">Useful practices</text><text class="body" x="537" y="543">Tests, version control,</text><text class="body" x="537" y="562">reproducible setup</text>
<rect class="card" x="823" y="182" width="326" height="262" rx="16" fill="#eef6ff" stroke="#70a9f0"/>
<text class="heading" x="846" y="224" fill="#174eaf">Collaborator use</text>
<text class="label" x="846" y="261">Main concern</text><text class="body" x="846" y="285">Support other users</text>
<text class="label" x="846" y="324">Failure matters because…</text><text class="body" x="846" y="348">Others may rely on it</text>
<text class="label" x="846" y="387">Useful practices</text><text class="body" x="846" y="411">Documentation, review, CI</text>
<rect class="card" x="1160" y="20" width="346" height="300" rx="16" fill="#fff5e8" stroke="#f59a3c"/>
<text class="heading" x="1183" y="64" fill="#af4a0d">Assured</text>
<text class="label" x="1183" y="104">Main concern</text><text class="body" x="1183" y="128">Demonstrate fitness for</text><text class="body" x="1183" y="151">intended use</text>
<text class="label" x="1183" y="189">Failure matters because…</text><text class="body" x="1183" y="213">Consequences may be</text><text class="body" x="1183" y="236">significant</text>
<text class="label" x="1183" y="272">Useful practices</text><text class="body" x="1183" y="296">Requirements, traceability,</text><text class="body" x="1183" y="315">verification / validation</text>
<!-- x category captions -->
<text x="365" y="834" font-size="20" font-weight="700" text-anchor="middle">Learn quickly</text><text x="365" y="859" class="small" text-anchor="middle">Individual exploration</text>
<text x="660" y="834" font-size="20" font-weight="700" text-anchor="middle">Ongoing research</text><text x="660" y="859" class="small" text-anchor="middle">Repeated lab use</text>
<text x="978" y="834" font-size="20" font-weight="700" text-anchor="middle">Support others</text><text x="978" y="859" class="small" text-anchor="middle">Shared use</text>
<text x="1317" y="834" font-size="20" font-weight="700" text-anchor="middle">Assured use</text><text x="1317" y="859" class="small" text-anchor="middle">Consequential outputs</text>
</svg>
